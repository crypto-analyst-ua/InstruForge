<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstruForge — відкриваємо сайт...</title>
  <style>
    body{background:#f8f9fa;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;color:#222}
    img{width:80px;height:80px;border-radius:12px;margin-bottom:12px}
    .loader{border:3px solid #ddd;border-top:3px solid #007bff;border-radius:50%;width:36px;height:36px;animation:spin 1s linear infinite;margin-top:16px}
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  </style>
  <!-- За замовчуванням 1 секунда, але JS читає ?to= -->
  <meta http-equiv="refresh" content="1; url=https://instruforge.web.app/">
  <script>
    function getParam(name) {
      const u = new URL(location.href);
      return u.searchParams.get(name);
    }
    const target = getParam('to') || 'https://instruforge.web.app/';
    // Робимо meta-refresh динамічно (щоб FB/инші бачили редирект)
    document.addEventListener('DOMContentLoaded', () => {
      // Оновити meta-refresh (прямо змінюємо head)
      let meta = document.querySelector('meta[http-equiv="refresh"]');
      if(!meta){
        meta = document.createElement('meta');
        meta.httpEquiv = 'refresh';
        document.head.appendChild(meta);
      }
      meta.content = "1; url=" + target;
      // Максимальний запасний варіант - JS редирект через 1100ms
      setTimeout(() => { window.location.href = target; }, 1100);
    });
  </script>
</head>
<body>
  <img src="https://instruforge.web.app/favicon.png" alt="InstruForge">
  <h2>InstruForge</h2>
  <p>Відкриваємо сайт… Якщо не відкрилося — натисніть <a id="link" href="#">тут</a>.</p>
  <div class="loader"></div>
  <script>
    document.getElementById('link').href = new URLSearchParams(location.search).get('to') || 'https://instruforge.web.app/';
  </script>
</body>
</html>
